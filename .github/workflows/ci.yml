name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }} ${{ matrix.deps }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Symfony 6.4 vyžaduje PHP >= 8.1, Symfony 7.x >= 8.2, Symfony 8.0 >= 8.4.
          - { php: '8.1', symfony: '6.4.*', deps: 'lowest' }
          - { php: '8.1', symfony: '6.4.*' }
          - { php: '8.2', symfony: '6.4.*' }
          - { php: '8.2', symfony: '7.0.*' }
          - { php: '8.3', symfony: '7.3.*' }
          - { php: '8.4', symfony: '7.3.*' }
          - { php: '8.4', symfony: '8.0.*' }
          - { php: '8.4', symfony: '6.4.*' }

    steps:
      - uses: actions/checkout@v4

      - name: Nastavit PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: opcache
          ini-values: opcache.enable_cli=1
          coverage: none

      - name: Zafixovat verzi Symfony
        run: composer require --no-update symfony/framework-bundle:"${{ matrix.symfony }}" symfony/console:"${{ matrix.symfony }}"

      - name: Nainstalovat závislosti
        run: composer update --prefer-dist --no-progress ${{ matrix.deps == 'lowest' && '--prefer-lowest' || '' }}

      - name: Testy
        run: vendor/bin/phpunit

  bez-console:
    name: Bez symfony/console
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Nainstalovat bez volitelných závislostí
        run: composer update --prefer-dist --no-progress

      - name: Odebrat console a ověřit, že kontejner drží
        # Bez symfony/console se příkaz jen nesmí zaregistrovat — web musí běžet dál.
        run: |
          composer remove --dev --no-update symfony/console
          composer update --prefer-dist --no-progress
          vendor/bin/phpunit --testsuite "Ewebovky Status Bundle" --filter 'StatusEndpointTest|WebStatusCollectorTest'

  phpstan:
    name: Statická analýza
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - run: composer update --prefer-dist --no-progress

      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M
